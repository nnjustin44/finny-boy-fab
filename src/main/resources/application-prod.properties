# Public origin used by canonical links, social metadata, structured data,
# robots.txt, sitemap.xml, and Stripe Checkout return URLs.
site.base-url=${SITE_BASE_URL:https://finnyboyfab.com}
stripe.app-base-url=${APP_BASE_URL:https://finnyboyfab.com}

# Honor X-Forwarded-* headers when deployed behind a managed HTTPS proxy.
server.forward-headers-strategy=framework

# Checkout must be deliberately enabled after completing LAUNCH_CHECKLIST.md.
store.checkout-enabled=${CHECKOUT_ENABLED:false}

# Only fingerprinted /assets/* receive long-lived caching in StorefrontProtectionFilter.
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.max-age=0s
