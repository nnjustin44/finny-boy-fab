spring.application.name=finnyboyfab-store
spring.profiles.active=local
server.port=${PORT:8080}

# Stripe keys must be supplied as environment variables; never commit live keys.
stripe.secret-key=${STRIPE_SECRET_KEY:}

# Keep the API key in MAILCHIMP_API_KEY. Example:
# MAILCHIMP_API_KEY=your-mailchimp-api-key-us1
# MAILCHIMP_AUDIENCE_ID can override this default.
mailchimp.audience-id=${MAILCHIMP_AUDIENCE_ID:c1ded455d7}
