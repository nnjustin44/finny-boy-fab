spring.application.name=finnyboyfab-store
spring.profiles.active=local
server.port=${PORT:8080}

# Stripe keys must be supplied as environment variables; never commit live keys.
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.automatic-tax-enabled=${STRIPE_AUTOMATIC_TAX_ENABLED:true}

# Public runtime settings (no frontend rebuild needed to change support details).
store.support-email=${SUPPORT_EMAIL:finnyboyfab@gmail.com}
store.checkout-enabled=${CHECKOUT_ENABLED:false}
store.made-to-order=${MADE_TO_ORDER:false}
store.launch-reviewed=${LAUNCH_REVIEWED:false}
store.data-dir=${STORE_DATA_DIR:./data}
store.cart-ttl-days=${CART_TTL_DAYS:30}
store.empty-cart-ttl-minutes=${EMPTY_CART_TTL_MINUTES:60}
store.max-carts=${MAX_CARTS:5000}
store.max-completions=${MAX_COMPLETIONS:10000}

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.tomcat.max-http-form-post-size=64KB
server.max-http-request-header-size=16KB
server.shutdown=graceful

# Keep the API key in MAILCHIMP_API_KEY. Example:
# MAILCHIMP_API_KEY=your-mailchimp-api-key-us1
# Newsletter signup is disabled unless all three values are deliberately configured.
mailchimp.enabled=${NEWSLETTER_ENABLED:false}
mailchimp.audience-id=${MAILCHIMP_AUDIENCE_ID:}
