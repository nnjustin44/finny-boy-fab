# Local development is the default profile.
site.base-url=${SITE_BASE_URL:${APP_BASE_URL:http://localhost:${PORT:8080}}}
stripe.app-base-url=${APP_BASE_URL:http://localhost:${PORT:8080}}

# Do not retain frontend assets while actively developing them.
spring.web.resources.cache.cachecontrol.max-age=0s
spring.web.resources.cache.cachecontrol.no-cache=true
